[project]
name = "streamclick"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "little-fox28", email = "tranthjnh288@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "boto3-stubs~=1.43.102",
    "confluent-kafka>=2.15.1",
    "fastapi>=0.141.1",
    "kagglehub>=1.0.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "requests>=2.34.2",
    "urllib3>=2.8.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
streamclick = "streamclick:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "kafka-python>=3.0.11",
    "requests>=2.34.2",
]

[tool.pyright]
extraPaths = ["."]

