services:
  # ============================================================================
  # MESSAGE BROKER: Redpanda (Kafka-compatible) & Console UI
  # ============================================================================
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.14
    container_name: streamclick-redpanda
    command:
      - redpanda start
      - --smp 1
      - --memory 256M
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --check=false
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644" # Admin API
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - streamclick-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
        reservations:
          cpus: '0.1'
          memory: 256M

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.5.2
    container_name: streamclick-redpanda-console
    environment:
      KAFKA_BROKERS: redpanda:29092
    ports:
      - "8080:8080"
    depends_on:
      - redpanda
    networks:
      - streamclick-net
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M

  # ============================================================================
  # DATA LAKE: MinIO (S3-compatible Object Storage)
  # ============================================================================
  minio:
    image: quay.io/minio/minio:latest
    container_name: streamclick-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web UI Console
    volumes:
      - minio_data:/data
    networks:
      - streamclick-net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 64M

  # ============================================================================
  # SERVING DATABASE: PostgreSQL (Speed Layer / Serving Layer)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: streamclick-postgres
    environment:
      POSTGRES_DB: streamclick
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secret_pw
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d streamclick"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - streamclick-net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 64M

  # ============================================================================
  # INGESTION API: FastAPI
  # ============================================================================
  ingestion-api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: streamclick-ingestion-api
    env_file:
      - .env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:29092
    ports:
      - "8000:8000"
    depends_on:
      redpanda:
        condition: service_healthy
    networks:
      - streamclick-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 192M
        reservations:
          cpus: '0.1'
          memory: 96M

  # ============================================================================
  # STREAM PROCESSING: Quix Streams (Speed Layer)
  # ============================================================================
  stream-processor:
    build:
      context: .
      dockerfile: streaming/Dockerfile
    container_name: streamclick-stream-processor
    env_file:
      - .env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:29092
      - POSTGRES_HOST=postgres
      - S3_ENDPOINT_URL=http://minio:9000
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - streamclick-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 192M
        reservations:
          cpus: '0.1'
          memory: 96M


  # ============================================================================
  # GRAFANA: Visualize (OLAP Layer)
  # ============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: streamclick-grafana
    ports:
      - "3000:3000"
    networks:
      - streamclick-net
    depends_on:
      - postgres

  # ============================================================================
  # BATCH LAYER: DataLake Consumer
  # ============================================================================
  batch-consumer:
    build:
      context: .
      dockerfile: batch/Dockerfile
    container_name: streamclick-batch-consumer
    env_file:
      - .env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:29092
      - S3_ENDPOINT_URL=http://minio:9000
    depends_on:
      redpanda:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - streamclick-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

volumes:
  minio_data:
  postgres_data:

networks:
  streamclick-net:
    driver: bridge
